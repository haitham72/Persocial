name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-pure:
    name: ruff + pure tests (no Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check persocial tests scripts evals examples
      - run: >-
          uv run pytest tests/test_local.py tests/test_adapters.py
          tests/test_golden.py tests/test_judge_parse.py tests/test_notebook.py
          -q -m "not db"

  db-tests:
    name: DB tests on local Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: uv run pytest tests/ -q

  web:
    name: web build + smoke on local Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: uv run persocial bootstrap
      - run: uv run python scripts/seed_smoke.py --email smoke@example.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: eval $(supabase status -o env) && node web/scripts/smoke.mjs "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" smoke@example.com

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
